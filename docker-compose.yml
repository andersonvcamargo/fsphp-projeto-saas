version: '3.8'

services:
  # Servidor Web (PHP 8.2 + Apache) com mod_rewrite e pdo_mysql habilitados
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_web_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  # Banco de Dados (MariaDB)
  db:
    image: mariadb:10.11
    container_name: saas_database
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fsphp_saas
    volumes:
      - mariadb_data:/var/lib/mysql

  # Adminer (interface web para administrar o banco de dados)
  adminer:
    image: adminer
    container_name: saas_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  mariadb_data: